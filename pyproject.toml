[project]
name = "zim-tui"
version = "0.1.0"
description = "A fast terminal UI for Zim notebooks"
readme = "README.md"
authors = [
    { name = "AND2797", email = "aditya.das2797@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
]

[project.scripts]
zim-tui = "zim_tui.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "textual-dev>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zim_tui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
